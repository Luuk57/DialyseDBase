<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dialyse Beheer & Vocht Monitor</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <!-- SheetJS voor Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #0056b3;
      --primary-dark: #004090;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }

    .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    h1 { color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    .tab-btn { background: #e2e8f0; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: background 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }

    label { font-weight: bold; margin-bottom: 6px; font-size: 0.9rem; }
    input, select, textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,86,179,0.15); }

    .readonly-field { background: #f1f5f9; font-weight: bold; color: #1e293b; }

    /* Kleurcodering voor UF advies */
    .uf-green { background-color: #d4edda !important; color: #155724 !important; border-color: #c3e6cb !important; font-weight: bold; }
    .uf-orange { background-color: #fff3cd !important; color: #856404 !important; border-color: #ffeeba !important; font-weight: bold; }
    .uf-red { background-color: #f8d7da !important; color: #721c24 !important; border-color: #f5c6cb !important; font-weight: bold; }

    .checkbox-row { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: #fff; }
    .checkbox-row input { width: 18px; height: 18px; cursor: pointer; }

    .nurse-checkbox-container { border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; max-height: 150px; overflow-y: auto; background: #fff; display: flex; flex-direction: column; gap: 8px; }
    .nurse-checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
    .nurse-checkbox-item input { width: 16px; height: 16px; cursor: pointer; }

    .add-nurse-box { display: flex; gap: 8px; margin-top: 8px; }
    .add-nurse-box input { flex: 1; padding: 6px 10px; font-size: 0.85rem; }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background 0.2s; }
    .btn:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #218838; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-excel { background: #1f7344; }
    .btn-excel:hover { background: #15572b; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }

    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 700px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: var(--primary); color: white; }
    tr:nth-child(even) { background: #f8fafc; }

    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .search-box { padding: 9px; width: 250px; border: 1px solid var(--border-color); border-radius: 6px; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; display: inline-block; }

    @media(max-width: 600px) {
      body { padding: 8px; }
      .container { padding: 12px; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>
    <span>Dialyse Beheer & Vocht Monitor</span>
    <span id="dryWeightLabel" style="font-size: 0.85rem; font-weight: normal; color: #555;">Huidig Drooggewicht: 118.0 kg</span>
  </h1>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('formTab', this)">Nieuwe Sessie / Bewerken</button>
    <button class="tab-btn" onclick="switchTab('listTab', this)">Overzicht & Exporteren</button>
  </div>

  <!-- TAB 1: FORMULIER -->
  <div id="formTab" class="tab-content active">
    <form id="dialysisForm" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="recordId" value="">
      
      <div class="form-grid">
        <div class="form-group">
          <label>ID (Automatisch uit Afspraak Tijdstip)</label>
          <input type="text" id="displayId" class="readonly-field" readonly placeholder="Wordt automatisch ingevuld">
        </div>

        <div class="form-group">
          <label>Soort Dialyse</label>
          <select id="soortDialyse" onchange="onSoortOfAfspraakChanged()">
            <option value="Nacht">Nacht (Duur +7u | Correctie 0.3)</option>
            <option value="Dag">Dag (Duur +4u | Correctie 0.6)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Afspraak Tijdstip</label>
          <input type="datetime-local" id="afspraakTijd" onchange="onAfspraakTijdChanged()" required>
        </div>

        <div class="form-group">
          <label>Start Tijdstip</label>
          <input type="datetime-local" id="startTijd" onchange="calculateDuration()" required>
        </div>

        <div class="form-group">
          <label>Eind Tijdstip</label>
          <input type="datetime-local" id="eindTijd" onchange="calculateDuration()" required>
        </div>

        <div class="form-group">
          <label>Duur (Automatisch berekend)</label>
          <input type="text" id="duur" class="readonly-field" readonly placeholder="0u 0m">
        </div>

        <div class="form-group">
          <label>Pre Gewicht (kg)</label>
          <input type="number" step="0.1" id="preGewicht" oninput="calculateCalculations()" placeholder="bijv. 120.5" required>
        </div>

        <div class="form-group">
          <label>Post Gewicht (kg)</label>
          <input type="number" step="0.1" id="postGewicht" oninput="calculateCalculations()" placeholder="bijv. 117.5" required>
        </div>

        <div class="form-group">
          <label>UF Advies (L) [Kleurcode]</label>
          <input type="text" id="ufAdvies" class="readonly-field" readonly placeholder="Wordt berekend">
        </div>

        <div class="form-group">
          <label>UF Ingesteld (L)</label>
          <input type="number" step="0.1" id="ufIngesteld" placeholder="Ingestelde UF">
        </div>

        <div class="form-group">
          <label>UF Werkelijk (Pre - Post) (L)</label>
          <input type="text" id="ufWerkelijk" class="readonly-field" readonly placeholder="Wordt automatisch berekend">
        </div>

        <!-- Verpleging: Meerdere selecties + Live toevoegen -->
        <div class="form-group full">
          <label>Betrokken Verpleging (Selecteer één of meerdere)</label>
          <div id="nurseCheckboxes" class="nurse-checkbox-container"></div>
          <div class="add-nurse-box">
            <input type="text" id="newNurseName" placeholder="Nieuwe verpleegkundige naam...">
            <button type="button" class="btn btn-sm" onclick="addNewNurseLive()">+ Toevoegen</button>
          </div>
        </div>

        <div class="form-group">
          <label>Fragmin 2500</label>
          <select id="fragmin2500">
            <option value="Nee">Nee</option>
            <option value="Ja">Ja</option>
          </select>
        </div>

        <div class="form-group">
          <label>Fragnin 5000</label>
          <select id="fragnin5000">
            <option value="Nee">Nee</option>
            <option value="Ja">Ja</option>
          </select>
        </div>

        <div class="form-group">
          <label>IJzer</label>
          <div class="checkbox-row">
            <input type="checkbox" id="ijzer">
            <label for="ijzer" style="margin-bottom:0; cursor:pointer;">IJzer toegediend</label>
          </div>
        </div>

        <div class="form-group">
          <label>Epo</label>
          <div class="checkbox-row">
            <input type="checkbox" id="epo">
            <label for="epo" style="margin-bottom:0; cursor:pointer;">Epo toegediend</label>
          </div>
        </div>

        <div class="form-group full">
          <label>Verslag / Bijzonderheden</label>
          <textarea id="verslag" rows="3" placeholder="Typ hier opmerkingen of bijzonderheden..."></textarea>
        </div>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn btn-success">Opslaan in Firebase</button>
        <button type="button" class="btn btn-secondary" onclick="resetForm()">Formulier Leegmaken</button>
      </div>
    </form>
  </div>

  <!-- TAB 2: OVERZICHT & EXPORT -->
  <div id="listTab" class="tab-content">
    <div class="actions-bar">
      <input type="text" id="searchBox" class="search-box" placeholder="Zoek in records..." onkeyup="filterRecords()">
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-excel" onclick="exportToExcel()">Exporteer naar Excel (.xlsx)</button>
        <button class="btn btn-secondary" onclick="exportPDF()">Print naar PDF</button>
        <button class="btn" onclick="loadData()">Gegevens Vernieuwen</button>
      </div>
    </div>

    <div class="table-container">
      <table id="recordsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Afspraak Tijd</th>
            <th>Soort</th>
            <th>Pre Gew.</th>
            <th>Post Gew.</th>
            <th>Droog Gew.</th>
            <th>UF Advies</th>
            <th>UF Werk.</th>
            <th>Verpleging</th>
            <th>Acties</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="10" style="text-align:center;">Gegevens laden uit Firebase...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Jouw Firebase configuratie
  const firebaseConfig = {
    apiKey: "AIzaSyBWaKFaJ1sUhSvXqK2pOCSDwJ3eMqDJag8",
    authDomain: "dialysedbase.firebaseapp.com",
    projectId: "dialysedbase",
    storageBucket: "dialysedbase.firebasestorage.app",
    messagingSenderId: "36507381882",
    appId: "1:36507381882:web:6cf9725f87c963c51ccbc3"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let nursesList = [];
  let allRecords = [];

  window.onload = function() {
    loadSettings();
    loadData();
  };

  function loadSettings() {
    db.collection('settings').doc('config').get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        nursesList = data.nurses || ['Marissa', 'Iris', 'Alice', 'Irmee', 'Sandra'];
      } else {
        nursesList = ['Marissa', 'Iris', 'Alice', 'Irmee', 'Sandra'];
        db.collection('settings').doc('config').set({ nurses: nursesList });
      }
      renderNurseCheckboxes([]);
      calculateCalculations();
    }).catch(err => {
      console.error("Fout bij laden instellingen: ", err);
    });
  }

  function addNewNurseLive() {
    const input = document.getElementById('newNurseName');
    const name = input.value.trim();
    if (!name) return;

    if (!nursesList.includes(name)) {
      nursesList.push(name);
      db.collection('settings').doc('config').update({ nurses: nursesList }).then(() => {
        let selected = getSelectedNurses();
        selected.push(name);
        renderNurseCheckboxes(selected);
        input.value = '';
      });
    }
  }

  function renderNurseCheckboxes(selectedNurses = []) {
    const container = document.getElementById('nurseCheckboxes');
    container.innerHTML = '';
    
    if (nursesList.length === 0) {
      container.innerHTML = '<span style="color:#777; font-size:0.85rem;">Geen verpleegkundigen gevonden.</span>';
      return;
    }

    nursesList.forEach(name => {
      const isChecked = selectedNurses.includes(name) ? 'checked' : '';
      const div = document.createElement('label');
      div.className = 'nurse-checkbox-item';
      div.innerHTML = `<input type="checkbox" value="${name}" ${isChecked} class="nurse-chk"> ${name}`;
      container.appendChild(div);
    });
  }

  function getSelectedNurses() {
    const checkboxes = document.querySelectorAll('.nurse-chk:checked');
    let selected = [];
    checkboxes.forEach(chk => selected.push(chk.value));
    return selected;
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function onAfspraakTijdChanged() {
    const afspraakVal = document.getElementById('afspraakTijd').value;
    if (!afspraakVal) return;

    const startInput = document.getElementById('startTijd');
    if (!startInput.value) {
      startInput.value = afspraakVal;
    }

    const d = new Date(afspraakVal);
    if (!isNaN(d)) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const generatedId = `${day}${month}${year}${hours}${minutes}`;
      document.getElementById('recordId').value = generatedId;
      document.getElementById('displayId').value = generatedId;
    }

    updateEindTijdEnDuur();
  }

  function onSoortOfAfspraakChanged() {
    updateEindTijdEnDuur();
    calculateCalculations();
  }

  function updateEindTijdEnDuur() {
    const startVal = document.getElementById('startTijd').value;
    const soort = document.getElementById('soortDialyse').value;
    
    if (startVal) {
      const startDate = new Date(startVal);
      if (!isNaN(startDate)) {
        const hoursToAdd = (soort === 'Nacht') ? 7 : 4;
        startDate.setHours(startDate.getHours() + hoursToAdd);

        const yr = startDate.getFullYear();
        const mth = String(startDate.getMonth() + 1).padStart(2, '0');
        const day = String(startDate.getDate()).padStart(2, '0');
        const hrs = String(startDate.getHours()).padStart(2, '0');
        const mins = String(startDate.getMinutes()).padStart(2, '0');

        document.getElementById('eindTijd').value = `${yr}-${mth}-${day}T${hrs}:${mins}`;
      }
    }
    calculateDuration();
  }

  function calculateDuration() {
    const start = new Date(document.getElementById('startTijd').value);
    const eind = new Date(document.getElementById('eindTijd').value);
    const duurField = document.getElementById('duur');

    if (!isNaN(start) && !isNaN(eind) && eind > start) {
      const diffMs = eind - start;
      const hours = Math.floor(diffMs / 3600000);
      const minutes = Math.floor((diffMs % 3600000) / 60000);
      duurField.value = `${hours}u ${minutes}m`;
    } else {
      duurField.value = '';
    }
  }

  // Bepaal dynamisch drooggewicht op basis van chronologische volgorde van records
  // Start op 118 kg. Als post-gewicht < huidig drooggewicht, wordt dat het nieuwe drooggewicht.
  function getDryWeightForSession(currentSessionTime, allSortedRecords) {
    let currentDry = 118.0;
    // Sorteer oud naar nieuw om historisch door te rekenen
    let chronological = [...allSortedRecords].reverse();
    
    for (let r of chronological) {
      if (r.afspraakTijd && currentSessionTime && r.afspraakTijd >= currentSessionTime) {
        break; // Stop bij de huidige sessie
      }
      let post = parseFloat(r.postGewicht);
      if (!isNaN(post)) {
        if (post < currentDry) {
          currentDry = post;
        }
      }
    }
    return currentDry;
  }

  function calculateCalculations() {
    const preGewicht = parseFloat(document.getElementById('preGewicht').value);
    const postGewicht = parseFloat(document.getElementById('postGewicht').value);
    const soort = document.getElementById('soortDialyse').value;
    const afspraakVal = document.getElementById('afspraakTijd').value;
    const ufAdviesField = document.getElementById('ufAdvies');
    const ufWerkelijkField = document.getElementById('ufWerkelijk');

    // Bereken het dynamische drooggewicht op dit moment
    let activeDryWeight = 118.0;
    if (allRecords.length > 0) {
      activeDryWeight = getDryWeightForSession(afspraakVal, allRecords);
    }
    document.getElementById('dryWeightLabel').innerText = `Huidig Drooggewicht: ${activeDryWeight.toFixed(1)} kg`;

    if (!isNaN(preGewicht)) {
      const correctie = (soort === 'Nacht') ? 0.3 : 0.6;
      const advies = preGewicht - activeDryWeight + correctie;
      ufAdviesField.value = advies.toFixed(2) + ' kg';

      ufAdviesField.className = 'readonly-field';
      if (advies >= 4.5) {
        ufAdviesField.classList.add('uf-red');
      } else if (advies >= 4.0) {
        ufAdviesField.classList.add('uf-orange');
      } else {
        ufAdviesField.classList.add('uf-green');
      }
    } else {
      ufAdviesField.value = '';
      ufAdviesField.className = 'readonly-field';
    }

    if (!isNaN(preGewicht) && !isNaN(postGewicht)) {
      const werkelijk = preGewicht - postGewicht;
      ufWerkelijkField.value = werkelijk.toFixed(2) + ' kg';
    } else {
      ufWerkelijkField.value = '';
    }
  }

  function handleFormSubmit(event) {
    event.preventDefault();
    
    const docId = document.getElementById('recordId').value;
    const selectedNurses = getSelectedNurses().join(', ');

    const formData = {
      id: docId,
      afspraakTijd: document.getElementById('afspraakTijd').value,
      soortDialyse: document.getElementById('soortDialyse').value,
      startTijd: document.getElementById('startTijd').value,
      eindTijd: document.getElementById('eindTijd').value,
      duur: document.getElementById('duur').value,
      preGewicht: parseFloat(document.getElementById('preGewicht').value) || 0,
      postGewicht: parseFloat(document.getElementById('postGewicht').value) || 0,
      ufAdvies: document.getElementById('ufAdvies').value,
      ufIngesteld: document.getElementById('ufIngesteld').value,
      ufWerkelijk: document.getElementById('ufWerkelijk').value,
      verpleging: selectedNurses,
      fragmin2500: document.getElementById('fragmin2500').value,
      fragnin5000: document.getElementById('fragnin5000').value,
      ijzer: document.getElementById('ijzer').checked ? 'Ja' : 'Nee',
      epo: document.getElementById('epo').checked ? 'Ja' : 'Nee',
      verslag: document.getElementById('verslag').value,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection('dialyse_records').doc(docId).set(formData).then(() => {
      alert('Succesvol opgeslagen in Firebase!');
      resetForm();
      loadData();
      switchTab('listTab', document.querySelectorAll('.tab-btn')[1]);
    }).catch(error => {
      alert('Fout bij opslaan: ' + error.message);
    });
  }

  function resetForm() {
    document.getElementById('dialysisForm').reset();
    document.getElementById('recordId').value = '';
    document.getElementById('displayId').value = '';
    document.getElementById('ufAdvies').className = 'readonly-field';
    renderNurseCheckboxes([]);
    loadData();
  }

  function loadData() {
    db.collection('dialyse_records').orderBy('afspraakTijd', 'desc').get().then(snapshot => {
      allRecords = [];
      snapshot.forEach(doc => {
        allRecords.push(doc.data());
      });
      renderTable(allRecords);
      calculateCalculations();
    }).catch(err => {
      console.error("Fout bij ophalen records: ", err);
    });
  }

  function renderTable(records) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (!records || records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">Geen records gevonden in Firebase.</td></tr>';
      return;
    }

    // Om drooggewicht per rij dynamisch te berekenen, sorteren we records chronologisch
    let sortedAsc = [...records].sort((a,b) => (a.afspraakTijd || "").localeCompare(b.afspraakTijd || ""));
    let runningDry = 118.0;
    let dryWeightMap = {};

    sortedAsc.forEach(r => {
      let post = parseFloat(r.postGewicht);
      dryWeightMap[r.id] = runningDry;
      if (!isNaN(post) && post < runningDry) {
        runningDry = post;
      }
    });

    records.forEach((r) => {
      let ufVal = String(r.ufAdvies || '');
      let ufClass = '';
      let numMatch = parseFloat(ufVal);
      if (!isNaN(numMatch)) {
        if (numMatch >= 4.5) ufClass = 'uf-red';
        else if (numMatch >= 4.0) ufClass = 'uf-orange';
        else ufClass = 'uf-green';
      }

      let sessionDry = dryWeightMap[r.id] !== undefined ? dryWeightMap[r.id] : 118.0;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.id || '-'}</td>
        <td>${r.afspraakTijd || '-'}</td>
        <td>${r.soortDialyse || '-'}</td>
        <td>${r.preGewicht || '-'} kg</td>
        <td>${r.postGewicht ? r.postGewicht + ' kg' : '-'}</td>
        <td><b>${sessionDry.toFixed(1)} kg</b></td>
        <td><span class="status-badge ${ufClass}">${ufVal}</span></td>
        <td>${r.ufWerkelijk || '-'}</td>
        <td>${r.verpleging || '-'}</td>
        <td>
          <button class="btn btn-sm" onclick='editRecord(${JSON.stringify(r)})'>Bewerken</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function editRecord(r) {
    document.getElementById('recordId').value = r.id;
    document.getElementById('displayId').value = r.id;
    document.getElementById('soortDialyse').value = r.soortDialyse || 'Nacht';
    document.getElementById('afspraakTijd').value = r.afspraakTijd || '';
    document.getElementById('startTijd').value = r.startTijd || '';
    document.getElementById('eindTijd').value = r.eindTijd || '';
    document.getElementById('duur').value = r.duur || '';
    document.getElementById('preGewicht').value = r.preGewicht || '';
    document.getElementById('postGewicht').value = r.postGewicht || '';
    document.getElementById('ufIngesteld').value = r.ufIngesteld || '';
    document.getElementById('fragmin2500').value = r.fragmin2500 || 'Nee';
    document.getElementById('fragnin5000').value = r.fragnin5000 || 'Nee';
    
    document.getElementById('ijzer').checked = (r.ijzer === 'Ja');
    document.getElementById('epo').checked = (r.epo === 'Ja');
    
    document.getElementById('verslag').value = r.verslag || '';

    let nursesListSelected = String(r.verpleging || '').split(',').map(n => n.trim());
    renderNurseCheckboxes(nursesListSelected);

    calculateCalculations();
    switchTab('formTab', document.querySelectorAll('.tab-btn')[0]);
  }

  function filterRecords() {
    const query = document.getElementById('searchBox').value.toLowerCase();
    const filtered = allRecords.filter(r => {
      return Object.values(r).some(val => String(val).toLowerCase().includes(query));
    });
    renderTable(filtered);
  }

  function exportToExcel() {
    if (!allRecords || allRecords.length === 0) {
      alert("Geen records om te exporteren.");
      return;
    }

    // Bereken dynamisch drooggewicht per record voor de export
    let sortedAsc = [...allRecords].sort((a,b) => (a.afspraakTijd || "").localeCompare(b.afspraakTijd || ""));
    let runningDry = 118.0;
    let dryWeightMap = {};

    sortedAsc.forEach(r => {
      let post = parseFloat(r.postGewicht);
      dryWeightMap[r.id] = runningDry;
      if (!isNaN(post) && post < runningDry) {
        runningDry = post;
      }
    });

    let excelData = allRecords.map(r => ({
      "Sessie ID": r.id,
      "Afspraak Tijdstip": r.afspraakTijd,
      "Soort Dialyse": r.soortDialyse,
      "Start Tijd": r.startTijd,
      "Eind Tijd": r.eindTijd,
      "Duur": r.duur,
      "Pre Gewicht (kg)": r.preGewicht,
      "Post Gewicht (kg)": r.postGewicht,
      "Drooggewicht (kg)": dryWeightMap[r.id] !== undefined ? dryWeightMap[r.id] : 118.0,
      "UF Advies": r.ufAdvies,
      "UF Ingesteld": r.ufIngesteld,
      "UF Werkelijk": r.ufWerkelijk,
      "Verpleging": r.verpleging,
      "Fragmin 2500": r.fragmin2500,
      "Fragmin 5000": r.fragnin5000,
      "IJzer": r.ijzer,
      "Epo": r.epo,
      "Verslag": r.verslag
    }));

    let worksheet = XLSX.utils.json_to_sheet(excelData);
    let workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Dialyse Overzicht");

    // Genereer Excel bestand en download
    XLSX.writeFile(workbook, "Dialyse_Overzicht_Rapport.xlsx");
  }

  function exportPDF() {
    window.print();
  }
</script>
